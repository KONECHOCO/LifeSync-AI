workflows:
  ios-app-store:
    name: LifeSync AI - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect
        - ios_signing
      vars:
        XCODE_WORKSPACE: "LifeSyncAI.xcworkspace"
        XCODE_SCHEME: "LifeSyncAI"
        BUNDLE_ID: "com.konechoco.lifesyncai"
        APP_STORE_APP_ID: "6813218004"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "$BUNDLE_ID"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install project tooling
        script: |
          brew install xcodegen
      - name: Set unique build number
        script: |
          # UTC timestamp (e.g. 202609181530): always increasing, never collides with earlier uploads
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Using build number $BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generate Xcode project
        script: |
          xcodegen generate
          xcodebuild -project LifeSyncAI.xcodeproj -scheme LifeSyncAI -showBuildSettings 2>/dev/null | grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION"
      - name: Install iOS dependencies
        script: |
          pod install --repo-update
      - name: Configure code signing
        script: |
          xcode-project use-profiles --project LifeSyncAI.xcodeproj
      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
