workflows:
  ios-app-store:
    name: LifeSync AI - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect
      vars:
        XCODE_WORKSPACE: "LifeSyncAI.xcworkspace"
        XCODE_SCHEME: "LifeSyncAI"
        BUNDLE_ID: "com.konechoco.lifesyncai"
        APP_STORE_APP_ID: "6813218004"
      ios_signing:
        # Il certificato (con chiave privata) e su Codemagic. I profili App Store dell'app iPhone e dell'app Watch
        # stanno nel repo (ios/profiles) e vengono installati da uno script; Codemagic richiede comunque un profilo
        # qui: `xcode-project use-profiles` sceglie quello con il bundle id corrispondente a ogni target.
        provisioning_profiles:
          - fuelsaver_appstore
        certificates:
          - ithelpdesk_distribution_20260916
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install project tooling
        script: |
          brew install xcodegen
      - name: Set unique build number
        script: |
          # UTC timestamp (e.g. 202609181530): always increasing, never collides with earlier uploads
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Using build number $BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generate Xcode project
        script: |
          xcodegen generate
          xcodebuild -project LifeSyncAI.xcodeproj -scheme LifeSyncAI -showBuildSettings 2>/dev/null | grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION"
      - name: Force build number in Info.plist
        script: |
          BUILD_NUMBER=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | head -1 | tr -dc '0-9')
          MARKETING=$(grep -E 'MARKETING_VERSION:' project.yml | head -1 | tr -dc '0-9.')
          for PLIST in ios/LifeSyncAI/Info.plist "ios/LifeSyncAI Watch App/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING" "$PLIST"
            echo "$PLIST -> $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"))"
          done
      - name: Install iOS dependencies
        script: |
          pod install --repo-update
      - name: Install App Store provisioning profiles (iPhone + Watch)
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp ios/profiles/lifesync_appstore.mobileprovision "$PROFILES_DIR/21caca58-59e0-4802-a59f-e3a2ac9ed06d.mobileprovision"
          cp ios/profiles/lifesync_watch_appstore.mobileprovision "$PROFILES_DIR/07717742-490c-4271-ae4b-3a890febf447.mobileprovision"
      - name: Configure code signing
        script: |
          xcode-project use-profiles --project LifeSyncAI.xcodeproj
      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Verify IPA build number
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > /tmp/ipa_info.plist
          echo "IPA CFBundleVersion = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /tmp/ipa_info.plist)"
          echo "IPA CFBundleShortVersionString = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/ipa_info.plist)"
          unzip -l "$IPA" | grep -i "Watch/.*\.app/Info.plist" || { echo "ERRORE: app Watch non incorporata nell'IPA"; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
